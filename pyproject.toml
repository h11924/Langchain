[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "11924harshitha@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "pip>=26.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain = "langchain:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
